# Machine-local Actio deployment. Listeners stay on loopback; the only public path is the shared
# Cloudflare tunnel behind Cloudflare Access (spec/feature/local-mode-cf-access.md).
# Ports and URLs come from this catalog: Excubitor injects ACTIO_PORT / ACTIO_WEB_PORT from
# `port` and ACTIO_URL / ACTIO_FRONTEND_URL from `provides`. Keep these in topology, not Vault or the encrypted config.
services:
  - code: actio
    name: Actio local API
    tier: personal
    project_code: actio
    component: backend
    port: 17880
    repo: LUDIARS/Actio
    runtime: node
    cwd: ${ARS_ROOT}/Actio
    command: node dist/src/bootstrap.js
    autostart: false
    restart_policy: "no"
    health:
      type: http
      # 死活は DB/Redis を引かない liveness で見る。依存の確認は /api/ready。
      # (/api/health は共有 DB の遅延で 1 秒の probe を超え、down 誤報が続いた)
      url: http://127.0.0.1:17880/api/health/live
      interval_sec: 30
      grace_period_sec: 20
    log_path: ${ARS_ROOT}/logs/actio
    env:
      NODE_ENV: production
      # Excubitor injects Vault secrets; encrypted local config fills settings not already injected.
      SECRETS_PROVIDER: env
      SSM_PATH_PREFIX: ""
      ACTIO_LOCAL_MODE: "1"
      # Access policy decides who passes; Actio verifies the assertion signature for this team.
      ACTIO_CLOUDFLARE_ENABLED: "1"
      ACTIO_CF_ACCESS_TEAM_DOMAIN: nyangame.cloudflareaccess.com
      ACTIO_CF_PUBLIC_ORIGIN: https://actio.ai-run-do.com
    provides:
      ACTIO_URL: http://127.0.0.1:${port}
  - code: actio-web
    name: Actio local web
    tier: personal
    project_code: actio
    component: frontend
    port: 17881
    repo: LUDIARS/Actio
    runtime: node
    cwd: ${ARS_ROOT}/Actio/frontend
    command: node node_modules/vite/bin/vite.js preview --strictPort
    depends_on: [actio]
    autostart: false
    restart_policy: "no"
    # Same repo and hash as the actio service; its deployment notification covers both.
    deploy_notify: false
    health:
      type: http
      url: http://127.0.0.1:17881/
      interval_sec: 30
      grace_period_sec: 15
    log_path: ${ARS_ROOT}/logs/actio-web
    env:
      NODE_ENV: production
      ACTIO_LOCAL_MODE: "1"
      ACTIO_CLOUDFLARE_ENABLED: "1"
      # Vite accepts this public host in local mode (the backend does the Access verification).
      ACTIO_CF_PUBLIC_ORIGIN: https://actio.ai-run-do.com
    provides:
      ACTIO_FRONTEND_URL: http://127.0.0.1:${port}
