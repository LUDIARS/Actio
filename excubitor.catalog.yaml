# Machine-local Actio deployment. Do not attach Cloudflare or expose these listeners.
# Ports and URLs come from this catalog: Excubitor injects ACTIO_PORT / ACTIO_WEB_PORT from
# `port` and ACTIO_URL / ACTIO_FRONTEND_URL from `provides`. Do not put them in .env or Infisical.
services:
  - code: actio
    name: Actio local API
    tier: personal
    project_code: actio
    component: backend
    port: 17880
    repo: LUDIARS/Actio
    runtime: node
    cwd: ${ARS_ROOT}/Actio
    command: node --env-file=.env dist/src/index.js
    autostart: false
    restart_policy: "no"
    health:
      type: http
      url: http://127.0.0.1:17880/api/health
      interval_sec: 30
      grace_period_sec: 20
    log_path: ${ARS_ROOT}/logs/actio
    env:
      NODE_ENV: production
      # Local deployment deliberately uses .env plus this catalog, not public Infisical URLs.
      SECRETS_PROVIDER: env
      INFISICAL_PROJECT_ID: ""
      SSM_PATH_PREFIX: ""
      ACTIO_LOCAL_MODE: "1"
      ACTIO_CLOUDFLARE_ENABLED: "0"
    provides:
      ACTIO_URL: http://127.0.0.1:${port}
  - code: actio-web
    name: Actio local web
    tier: personal
    project_code: actio
    component: frontend
    port: 17881
    repo: LUDIARS/Actio
    runtime: node
    cwd: ${ARS_ROOT}/Actio/frontend
    command: node --env-file=../.env node_modules/vite/bin/vite.js preview --strictPort
    depends_on: [actio]
    autostart: false
    restart_policy: "no"
    # Same repo and hash as the actio service; its deployment notification covers both.
    deploy_notify: false
    health:
      type: http
      url: http://127.0.0.1:17881/
      interval_sec: 30
      grace_period_sec: 15
    log_path: ${ARS_ROOT}/logs/actio-web
    env:
      NODE_ENV: production
      ACTIO_LOCAL_MODE: "1"
      ACTIO_CLOUDFLARE_ENABLED: "0"
    provides:
      ACTIO_FRONTEND_URL: http://127.0.0.1:${port}
